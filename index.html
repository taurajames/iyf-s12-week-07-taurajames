<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My To-Do List</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main class="todo-container">
            <h1>My To-Do List</h1>

            <form id="todo-form">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                />
                <button type="submit">Add Task</button>
            </form>

            <ul id="todo-list"></ul>

            <div class="todo-footer">
                <p id="items-left">0 items left</p>

                <div class="filters">
                    <button
                        type="button"
                        class="filter-btn active"
                        data-filter="all"
                    >
                        All
                    </button>

                    <button
                        type="button"
                        class="filter-btn"
                        data-filter="active"
                    >
                        Active
                    </button>

                    <button
                        type="button"
                        class="filter-btn"
                        data-filter="completed"
                    >
                        Completed
                    </button>
                </div>

                <button type="button" id="clear-completed">
                    Clear Completed
                </button>
            </div>
        </main>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
